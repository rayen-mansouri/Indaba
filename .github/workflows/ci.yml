name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src scripts/evaluate_authority_ablation.py
      - run: uv run pytest -q
      - run: uv run --project ../.. pytest -q
        working-directory: starter-kits/python-defense
      - run: uv run --project ../.. pytest -q
        working-directory: starter-kits/learned-monitor
