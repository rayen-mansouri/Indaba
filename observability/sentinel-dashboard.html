<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SENTINEL Dashboard</title>
<style>
:root{--bg:#0b0f14;--panel:#121823;--p2:#182131;--line:#243044;--tx:#e6edf6;--mut:#8b9bb4;--ok:#3ddc97;--bad:#ff5d73;--warn:#ffb84d;--acc:#5ab0ff;--vio:#b48cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0b0f14ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0;letter-spacing:.5px}
header h1 span{color:var(--acc)}
nav{display:flex;gap:4px;flex-wrap:wrap}
button,select,.btn{background:var(--p2);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
button:hover,.btn:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#04121f;border-color:var(--acc);font-weight:600}
.sp{flex:1}
main{padding:20px;max-width:1400px;margin:0 auto}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);font-weight:600}
.kpi .v{font-size:26px;font-weight:700}
.kpi .l{color:var(--mut);font-size:12px}
.good{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--mut)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px;white-space:nowrap}
td.c,th.c{text-align:center}
.scroll{overflow-x:auto}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0}
.bar .n{width:190px;flex:none;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t{flex:1;background:var(--p2);border-radius:4px;height:16px;position:relative;overflow:hidden}
.bar .f{height:100%;border-radius:4px}
.bar .x{width:70px;text-align:right;font-size:12px;color:var(--mut);flex:none}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--p2)}
.stack div{height:100%}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;margin:1px 2px 1px 0;background:var(--p2);border:1px solid var(--line)}
.d-allow{color:var(--ok)}.d-block{color:var(--bad)}.d-escalate{color:var(--warn)}.d-rewrite{color:var(--vio)}
.cell{cursor:pointer;text-align:center;font-weight:700;border-radius:4px}
.cell.ok{background:#3ddc9722;color:var(--ok)}.cell.breach{background:#ff5d7333;color:var(--bad)}.cell.util{background:#ffb84d22;color:var(--warn)}.cell.none{color:var(--line)}
.cell.sel{outline:2px solid var(--acc)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:10px 16px;color:var(--mut);cursor:pointer}
.drop.over{border-color:var(--acc);color:var(--tx)}
.notice{border-left:3px solid var(--acc);background:#5ab0ff10;padding:10px 12px;border-radius:6px;color:var(--mut)}
.lens{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.lens div{background:var(--p2);border-radius:8px;padding:10px}
.lens b{display:block;margin-bottom:4px}
a{color:var(--acc)}
small{color:var(--mut)}
</style>
</head>
<body>

</header>

  const head = METRICS.map(x => `<th class="c" title="${esc(x[2])}">${x[1]}</th>`).join('');
  const rows = runs.map(({r, i}) => `<tr><td><a href="#" data-sel="${i}">${esc(r.label)}</a><br><small>${esc(r.defense)} · ${esc(r.attack_mode)}${r.ablation ? ' · ' + esc(r.ablation) : ''}</small></td>` +
    METRICS.map(([k, s, l, dir, kind]) => `<td class="c ${tone(r.metrics[k], dir, kind)}">${fmt(r.metrics[k], kind)}</td>`).join('') + '</tr>').join('');
  const chart = bars(runs.map(({r}) => ({label: r.label, value: r.metrics[S.metric] ?? 0, text: fmt(r.metrics[S.metric], mm[4]),
    color: tone(r.metrics[S.metric], mm[3], mm[4]) === 'bad' ? 'var(--bad)' : tone(r.metrics[S.metric], mm[3], mm[4]) === 'warn' ? 'var(--warn)' : 'var(--ok)'})), {max: mm[4] === 'pct' ? 1 : undefined});
  return `<div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap">
    ${['public','validation'].map(s => `<button data-split="${s}" class="${S.split===s?'on':''}">${s}</button>`).join('')}
    <span class="mut">metric</span><select id="msel">${METRICS.map(x => `<option value="${x[0]}" ${x[0]===S.metric?'selected':''}>${x[1]} — ${x[2]}</option>`).join('')}</select></div>
  <div class="grid two"><div class="card"><h3>${esc(mm[2])} by defense / ablation</h3>${chart}</div>
  <div class="card"><h3>Reading the ablations</h3><small>Baselines (allow_all, heuristic_risk, provenance) vs. SENTINEL and its ablations (<code>no_task_g7</code>, <code>whole_context</code>, authority ablation, adaptive mutation). Lower is better for ASR/CVR/FBR/UER/Brier/ECE; higher for BTU/TUI/DFI. Green ≥95% good, amber ≥80%, red otherwise (rate metrics only).</small></div></div>
  <div class="card scroll" style="margin-top:14px"><h3>All metrics</h3><table><tr><th>run</th>${head}</tr>${rows || '<tr><td>No runs for this split</td></tr>'}</table></div>`;
}

function vScenarios() {
  const runs = RUNS.map((r, i) => ({r, i})).filter(x => x.r.split === S.split);
  const ids = [...new Set(runs.flatMap(x => x.r.outcomes.map(o => o.scenario_id)))].sort();
  const dom = id => (runs.flatMap(x => x.r.outcomes).find(o => o.scenario_id === id) || {}).domain || '';
  const head = runs.map(x => `<th class="c" style="font-size:10px;max-width:90px;white-space:normal">${esc(x.r.label.replace(/^(public|validation)-/, ''))}</th>`).join('');
  const rows = ids.map(id => `<tr><td>${esc(id)}<br><small>${esc(dom(id))}</small></td>` + runs.map(({r, i}) => {
    const o = r.outcomes.find(o => o.scenario_id === id), st = status(o);
    const sel = S.detail && S.detail.i === i && S.detail.id === id ? ' sel' : '';
    return `<td class="cell ${st}${sel}" data-run="${i}" data-id="${esc(id)}" title="${o ? (o.attack_present ? 'attack: ' + o.attack_family : 'benign') : 'not run'}">${STAT[st]}</td>`;
  }).join('') + '</tr>').join('');
  return `<div style="display:flex;gap:8px;margin-bottom:12px">${['public','validation'].map(s => `<button data-split="${s}" class="${S.split===s?'on':''}">${s}</button>`).join('')}
    <span class="mut" style="align-self:center">✓ safe &amp; useful · ✗ breach (attack succeeded) · task ✗ (safe but task failed)</span></div>
  <div class="card scroll"><h3>Scenario × defense matrix — click a cell</h3><table><tr><th>scenario</th>${head}</tr>${rows}</table></div>
  <div id="detail" style="margin-top:14px">${detail()}</div>`;
}
function detail() {
  if (!S.detail) return '<div class="card"><small>Select a cell to inspect the decision timeline.</small></div>';
  const r = RUNS[S.detail.i], o = r.outcomes.find(o => o.scenario_id === S.detail.id);
  if (!o) return '';
  const rows = (o.decisions || []).map(d => `<tr><td>${d.step_id}</td><td>${esc(d.tool || d.action_type)}</td><td class="d-${d.decision}"><b>${d.decision}</b>${d.human_approved != null ? ' (human: ' + (d.human_approved ? 'approved' : 'denied') + ')' : ''}</td>
    <td>${num(d.risk_score, 2)}</td><td>${num(d.confidence, 2)}</td><td>${(d.reason_codes || []).map(c => `<span class="tag">${esc(c)}</span>`).join('')}</td>
    <td>${d.legitimate == null ? '' : d.legitimate ? 'legit' : '<span class="bad">illegit</span>'}${d.consequential ? ' · consequential' : ''}</td><td>${d.latency_ms == null ? '' : Number(d.latency_ms).toFixed(1)}</td></tr>`).join('');
  const gr = (o.grader_results || []).map(g => `<div>${g.passed ? '<span class="good">✓</span>' : '<span class="bad">✗</span>'} <small>${esc(g.condition)}${g.detail ? ' — ' + esc(g.detail) : ''}</small></div>`).join('');
  const fi = (o.findings || []).map(f => `<div class="bad"><small>${esc(typeof f === 'string' ? f : JSON.stringify(f))}</small></div>`).join('');
  return `<div class="card"><h3>${esc(o.scenario_id)} · ${esc(r.label)}</h3>
    <p>${o.attack_present ? `Attack family <b>${esc(o.attack_family)}</b>` : 'Benign'} · task success <b class="${o.task_success ? 'good' : 'bad'}">${o.task_success}</b> · attack success <b class="${o.attack_success ? 'bad' : 'good'}">${o.attack_success}</b> · steps ${o.steps} · ${esc(o.termination)}</p>
    <div class="scroll"><table><tr><th>step</th><th>tool</th><th>decision</th><th>risk</th><th>conf</th><th>reason codes</th><th>post-run label</th><th>ms</th></tr>${rows}</table></div>
    ${gr ? `<h3 style="margin-top:12px">Success conditions</h3>${gr}` : ''}${fi ? `<h3 style="margin-top:12px">Policy findings</h3>${fi}` : ''}</div>`;
}

function vReasons() {
  const run = RUNS[S.sel]; if (!run) return '';
  const decisions = allDecisions(run), rc = {}, byTool = {};
  for (const d of decisions) {
    if (d.decision === 'allow') continue;
    byTool[d.tool || '?'] = (byTool[d.tool || '?'] || 0) + 1;
    for (const c of d.reason_codes || []) rc[c] = (rc[c] || 0) + 1;
  }
  const top = o => Object.entries(o).sort((a, b) => b[1] - a[1]).map(([k, v]) => ({label: k, value: v, text: v}));
  let ba = '';
  if (DATA.block_attribution) {
    const s = DATA.block_attribution.summary || {};
    ba = `<div class="card"><h3>Block attribution (public + validation, post-run)</h3>` +
      Object.entries(s).map(([k, v]) => `<div class="bar"><div class="n" style="width:330px" title="${esc(k)}">${esc(k.replace(/_/g, ' '))}</div><div class="x" style="text-align:left;color:var(--tx)">${esc(v)}</div></div>`).join('') +
      `<small>${esc(DATA.block_attribution.method || '')}</small></div>`;
  }
  const intervened = decisions.filter(d => d.legitimate === true && d.decision !== 'allow');
  const interventionRows = intervened.map(d => `<tr><td>${esc(d.scenario_id)}</td><td>${d.step_id}</td>
    <td>${esc(d.tool || d.action_type)}</td><td class="d-${d.decision}"><b>${esc(d.decision)}</b></td>
    <td>${(d.reason_codes || []).map(c => `<span class="tag">${esc(c)}</span>`).join('')}</td>
    <td>${d.human_approved == null ? '—' : d.human_approved ? 'approved' : 'denied'}</td></tr>`).join('');
  return `<p class="mut">Run: <b>${esc(run.label)}</b> — non-allow decisions only.</p><div class="grid two">
    <div class="card"><h3>Reason codes</h3>${bars(top(rc), {})}</div><div class="card"><h3>Non-allowed actions by tool</h3>${bars(top(byTool).map(x => ({...x, color: 'var(--vio)'})), {})}</div>${ba}</div>
    <div class="card scroll" style="margin-top:14px"><h3>Legitimate actions receiving intervention (post-run)</h3>
    <table><tr><th>scenario</th><th>step</th><th>tool</th><th>decision</th><th>reason codes</th><th>human</th></tr>
    ${interventionRows || '<tr><td colspan="6"><small>None in this scorecard.</small></td></tr>'}</table>
    <small>Legitimacy and human outcome are evaluator-only labels. This panel diagnoses false blocks and well-judged escalations after the run; it is never a decision input.</small></div>`;
}

function vEvidence() {
  const live = DATA.manifest && DATA.manifest.live_model, pair = DATA.manifest && DATA.manifest.qwen_paired_control;
  const rows = QWEN.map(q => `<tr><td>${esc(q.group)}</td><td>${esc(q.scenario_id)}</td><td>${esc(q.defense)}</td><td>${q.attack_present ? esc(q.attack_family) : 'benign'}</td>
    <td class="${q.task_success ? 'good' : 'bad'}">${q.task_success}</td><td class="${q.attack_success ? 'bad' : 'good'}">${q.attack_success}</td>
    <td>${(q.decisions || []).map(d => `<span class="tag"><b class="d-${d.decision}">${d.decision}</b> ${esc(d.tool || d.action_type)}</span>`).join('')}</td></tr>`).join('');
  return `<div class="grid two">
    <div class="card"><h3>Live model</h3>${live ? Object.entries(live).map(([k, v]) => `<div><small>${esc(k)}</small>: ${esc(v)}</div>`).join('') : '<small>n/a</small>'}</div>
    <div class="card"><h3>Paired control (non-vacuous attack)</h3>${pair ? `<div>${esc(pair.scenario)}</div>
      <div>allow_all → attack success <b class="${pair.allow_all_attack_success ? 'bad' : 'good'}">${pair.allow_all_attack_success}</b></div>
      <div>sentinel → attack success <b class="${pair.sentinel_attack_success ? 'bad' : 'good'}">${pair.sentinel_attack_success}</b>, task success <b class="${pair.sentinel_task_success ? 'good' : 'bad'}">${pair.sentinel_task_success}</b></div>
      <small>${esc(pair.interpretation)}</small>` : '<small>n/a</small>'}</div></div>
  <div class="card scroll" style="margin-top:14px"><h3>Real-model (Qwen3-8B) run summaries</h3><table><tr><th>group</th><th>scenario</th><th>defense</th><th>attack</th><th>task ok</th><th>attack ok</th><th>decisions</th></tr>${rows || '<tr><td>none loaded</td></tr>'}</table>
  <small>Drop <code>*.summary.json</code> files from new Colab runs via “Load scorecards / summaries”. Full JSONL traces open in the trace viewer.</small></div>`;
}

/* ---------- shell ---------- */
const TABS = [['overview','Overview'],['compare','Compare & ablations'],['scenarios','Scenarios'],['reasons','Reasons & blocks'],['evidence','Real-model evidence']];
const VIEWS = {overview: vOverview, compare: vCompare, scenarios: vScenarios, reasons: vReasons, evidence: vEvidence};
function render() {
  $('#nav').innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" class="${S.tab === k ? 'on' : ''}">${l}</button>`).join('');
  $('#runsel').innerHTML = RUNS.map((r, i) => `<option value="${i}" ${i === S.sel ? 'selected' : ''}>${esc(r.label)}</option>`).join('');
  $('#view').innerHTML = VIEWS[S.tab]();
  $('#runsel').style.display = ['overview', 'reasons'].includes(S.tab) ? '' : 'none';
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-split],[data-run],[data-sel]'); if (!t) return;
  if (t.dataset.tab) S.tab = t.dataset.tab;
  else if (t.dataset.split) S.split = t.dataset.split;
  else if (t.dataset.run !== undefined) S.detail = {i: +t.dataset.run, id: t.dataset.id};
  else if (t.dataset.sel !== undefined) { e.preventDefault(); S.sel = +t.dataset.sel; S.tab = 'overview'; }
  render();
});
document.addEventListener('change', e => {
  if (e.target.id === 'runsel') { S.sel = +e.target.value; render(); }
  if (e.target.id === 'msel') { S.metric = e.target.value; render(); }
});
async function loadFiles(files) {
  for (const f of files) {
    try {
      const d = JSON.parse(await f.text()), label = f.name.replace(/\.json$/, '');
      if (d && d.outcomes && d.metrics) { RUNS.push(norm(d, label)); S.sel = RUNS.length - 1; S.split = d.split || S.split; S.tab = 'overview'; }
      else if (d && d.scenario_id && Array.isArray(d.decisions)) QWEN.push({...d, group: 'loaded'});
      else alert(f.name + ': not a scorecard or run summary');
    } catch (err) { alert(f.name + ': ' + err.message); }
  }
  render();
}
$('#file').addEventListener('change', e => loadFiles(e.target.files));
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); loadFiles(e.dataTransfer.files); });
render();
</script>
</body>
</html>
